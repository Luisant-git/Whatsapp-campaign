# Nginx Configuration for Backend API: api.whasuite360.in
# Target location on VPS: /etc/nginx/sites-available/api.whasuite360.in

server {
    listen 80;
    listen [::]:80;
    server_name api.whasuite360.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.whasuite360.in;

    # SSL Configuration (Certbot will manage these paths)
    ssl_certificate /etc/letsencrypt/live/api.whasuite360.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.whasuite360.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Buffer & Body sizes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50M;

    # Proxy all requests to NestJS backend on port 4090
    location / {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
